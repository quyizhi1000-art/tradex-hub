[mcp_servers.tradex]
url = "http://127.0.0.1:8000/mcp"
startup_timeout_sec = 15.0
tool_timeout_sec = 50.0
required = false
enabled = true
enabled_tools = [
    "get_data_source_health",
    "list_all_tools",
    "search_stock",
    "get_realtime_quote",
    "get_historical_price",
    "get_market_overview",
    "get_index_volume_compare",
    "get_money_flow",
]

# Capability profiles are separate disabled MCP entries so Codex never loads
# their schemas until a new task explicitly enables the profile it needs.
[mcp_servers.tradex_ops]
url = "http://127.0.0.1:8000/mcp"
startup_timeout_sec = 15.0
tool_timeout_sec = 50.0
required = false
enabled = false
enabled_tools = [
    "get_cache_stats",
    "health_check",
    "get_data_source_dashboard",
]

