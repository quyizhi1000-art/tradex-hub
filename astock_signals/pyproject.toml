[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "astock-signals"
version = "1.1.0"
description = "A-share signal data modules used by tradex"
requires-python = ">=3.10"
dependencies = [
    "akshare>=1.18.91",
    "pandas>=2.0.0",
    "requests>=2.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astock_signals"]
